{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{% static 'style.css' %}">
        <title>Update task</title>
    </head>
    <body>
        <div class="df">
            <h1 class="as">Update task</h1>

            <form method="POST">
                {% csrf_token %}

                <input type="text" name="title" placeholder="Title"
                       value="{{task.title}}" required maxlength="200">

                <input type="text" name="description" placeholder="Description">{{task.description}}

                <label>
                    <input type="checkbox" name="is_completed" {{task.is_completed|yesno:"checked,"}}>
                    Completed
                </label>

                <button class="bt" type="submit">Save</button>
                <a class="bt" href="{% url 'profile' %}">Profile</a>
            </form>
        </div>
    </body>
</html>
